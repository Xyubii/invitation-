<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة كتب كتاب</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fdf6f0;
            text-align: center;
            padding: 50px 20px;
            color: #4a4a4a;
        }
        .container {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        h1 { color: #d4af37; font-size: 2.5em; }
        .date { font-size: 1.5em; font-weight: bold; margin: 20px 0; }
        .details { margin: 30px 0; line-height: 1.8; }
        footer { margin-top: 30px; font-size: 0.9em; color: #888; }
    </style>
</head>
<body>

    <div class="container">
        <h1>دعوة فرح</h1>
        <p>بكل الحب والود، نتشرّف بدعوتكم لحضور عقد قراننا</p>
        
        <div class="date">
            يوم الجمعة<br>
            ٣ يوليو ٢٠٢٦
        </div>

        <div class="details">
            الساعة: ٧:٠٠ مساءً<br>
            المكان: القاهرة
        </div>

        <p>حضوركم يكتمل به فرحنا</p>
        <p>بانتظاركم!</p>

        <footer>يسعدنا تشريفكم</footer>
    </div>

</body>
</html>
