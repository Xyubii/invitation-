<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة عقد قران | Wedding Invitation</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital@0;1&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background-color: #0a0a0a;
            color: #c5a059;
            font-family: 'Tajawal', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .card {
            width: 90%;
            max-width: 600px;
            padding: 60px 30px;
            text-align: center;
            border: 1px solid #2d2618;
            background: radial-gradient(circle, #1a1a1a 0%, #0a0a0a 100%);
            box-shadow: 0 0 50px rgba(197, 160, 89, 0.1);
            animation: fadeIn 2s ease-in;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        h1 { font-family: 'Playfair Display', serif; font-size: 2.5em; margin-bottom: 10px; font-weight: 400; }
        .subtitle { font-family: 'Amiri', serif; font-size: 1.2em; color: #888; font-style: italic; }
        
        .divider { width: 80px; height: 1px; background: #c5a059; margin: 30px auto; }
        
        .date-time { margin: 40px 0; }
        .date { font-size: 2em; color: #fff; display: block; font-family: 'Playfair Display', serif; }
        .day { font-size: 1.1em; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 10px; }
        
        .location { font-size: 1.2em; line-height: 2; margin-top: 20px; }
        .location span { display: block; font-size: 0.9em; color: #777; font-family: 'Playfair Display', serif; }
        
        .footer { margin-top: 50px; font-size: 0.9em; letter-spacing: 2px; text-transform: uppercase; color: #888; }
    </style>
</head>
<body>

    <div class="card">
        <h1>عقد قران</h1>
        <div class="subtitle">The Wedding Ceremony</div>
        
        <div class="divider"></div>
        
        <p>بكل الحب والامتنان، نتشرف بدعوتكم لمشاركتنا لحظة العمر</p>
        <p style="font-style: italic;">We cordially invite you to celebrate our union</p>

        <div class="date-time">
            <div class="day">Friday, July 3, 2026</div>
            <div class="date">٣ يوليو ٢٠٢٦</div>
        </div>

        <div class="location">
            الساعة ٧:٠٠ مساءً | 7:00 PM
            <span>القاهرة - مصر | Cairo, Egypt</span>
        </div>

        <div class="divider"></div>
        
        <div class="footer">حضوركم هو تمام فرحتنا</div>
        <div class="footer" style="font-size: 0.7em;">Your presence completes our joy</div>
    </div>

</body>
</html>
